<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS — Ruben Schuckit</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- EasyMDE Editor -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.20.0/dist/easymde.min.css">
  <script src="https://cdn.jsdelivr.net/npm/easymde@2.20.0/dist/easymde.min.js"></script>

  <!-- Markdown parser + frontmatter -->
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/cms/cms.css">
</head>
<body>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- LOGIN SCREEN                                    -->
  <!-- ═══════════════════════════════════════════════ -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
      </div>
      <h1 class="login-title">Content Manager</h1>
      <p class="login-subtitle">Sign in with GitHub to manage your site</p>
      <button id="login-btn" class="login-btn" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
        </svg>
        Sign in with GitHub
      </button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- APP SHELL                                       -->
  <!-- ═══════════════════════════════════════════════ -->
  <div id="app" class="app hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h2 class="sidebar-brand">CMS</h2>
        <button id="new-content-btn" class="btn-new" title="New Content">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>

      <!-- Content Type Tabs -->
      <div class="sidebar-tabs">
        <button class="tab-btn active" data-tab="posts">Posts</button>
        <button class="tab-btn" data-tab="pages">Pages</button>
        <button class="tab-btn" data-tab="images">Images</button>
      </div>

      <!-- Content List -->
      <div id="content-list" class="content-list">
        <div class="loading-spinner"></div>
      </div>

      <!-- Image Gallery (hidden by default) -->
      <div id="image-gallery" class="image-gallery hidden">
        <div class="loading-spinner"></div>
      </div>

      <div class="sidebar-footer">
        <button id="logout-btn" class="btn-logout" title="Sign Out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign Out
        </button>
      </div>
    </aside>

    <!-- Main Editor Area -->
    <main id="editor-area" class="editor-area">

      <!-- Empty State -->
      <div id="empty-state" class="empty-state">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.3">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        <p>Select a file to edit or create a new one</p>
      </div>

      <!-- Editor Panel -->
      <div id="editor-panel" class="editor-panel hidden">

        <!-- Frontmatter Bar -->
        <div class="frontmatter-bar">
          <div class="fm-row">
            <label for="fm-title">Title</label>
            <input type="text" id="fm-title" placeholder="Post title…">
          </div>
          <div class="fm-row-group">
            <div class="fm-row">
              <label for="fm-date">Date</label>
              <input type="date" id="fm-date">
            </div>
            <div class="fm-row">
              <label for="fm-tags">Tags</label>
              <input type="text" id="fm-tags" placeholder="tag1, tag2…">
            </div>
            <div class="fm-row">
              <label for="fm-layout">Layout</label>
              <select id="fm-layout">
                <option value="layouts/post.njk">Post</option>
                <option value="layouts/page.njk">Page</option>
                <option value="layouts/home.njk">Home</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Markdown Editor -->
        <div class="editor-wrapper">
          <textarea id="markdown-editor"></textarea>
        </div>

        <!-- Editor Toolbar (bottom) -->
        <div class="editor-bottom-bar">
          <div class="editor-status" id="editor-status">Ready</div>
          <div class="editor-actions">
            <button id="delete-btn" class="btn-delete" title="Delete">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              Delete
            </button>
            <button id="save-btn" class="btn-save" title="Save (Ctrl+S)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              Save
            </button>
          </div>
        </div>
      </div>

      <!-- Image Upload Overlay (drag & drop) -->
      <div id="drop-overlay" class="drop-overlay hidden">
        <div class="drop-overlay-content">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
          </svg>
          <p>Drop image to upload</p>
        </div>
      </div>

    </main>

    <!-- Image Upload Modal -->
    <div id="image-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h3>Upload Image</h3>
          <button id="modal-close" class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <div id="upload-zone" class="upload-zone">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
            </svg>
            <p>Drop an image here or <label for="file-input" class="file-label">browse</label></p>
            <input type="file" id="file-input" accept="image/*" multiple hidden>
          </div>
          <div id="upload-preview" class="upload-preview hidden"></div>
          <div id="upload-progress" class="upload-progress hidden">
            <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
            <span id="progress-text">Uploading…</span>
          </div>
        </div>
        <div class="modal-footer">
          <button id="upload-confirm" class="btn-save" disabled>Upload & Insert</button>
        </div>
      </div>
    </div>

    <!-- New Content Modal -->
    <div id="new-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content modal-sm">
        <div class="modal-header">
          <h3>New Content</h3>
          <button class="modal-close" data-close="new-modal">&times;</button>
        </div>
        <div class="modal-body">
          <div class="fm-row">
            <label for="new-type">Type</label>
            <select id="new-type">
              <option value="post">Blog Post</option>
              <option value="page">Page</option>
            </select>
          </div>
          <div class="fm-row">
            <label for="new-title">Title</label>
            <input type="text" id="new-title" placeholder="My New Post…">
          </div>
        </div>
        <div class="modal-footer">
          <button id="new-confirm" class="btn-save">Create</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="/cms/cms.js"></script>
</body>
</html>
